<!DOCTYPE html>
<html>

<head>
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            display: flex;
            gap: 30px;
            background: #f4f4f4;
        }

        .left, .right {
            width: 50%;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="left">

        <h2>Registered Users</h2>

        <table id="userTable">

            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Event</th>
                <th>Date</th>
            </tr>

        </table>

    </div>


    <div class="right">

        <h2>Event Registration Page</h2>

        <input type="text" id="name" placeholder="Name">

        <input type="text" id="phone" placeholder="Phone Number">

        <input type="email" id="email" placeholder="Email">

        <select id="event">
            <option>Tech Fest</option>
            <option>Workshop</option>
            <option>Hackathon</option>
            <option>Seminar</option>
        </select>

        <input type="date" id="date">

        <button onclick="register()">Submit</button>

    </div>


    <script>

        async function register() {

            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let email = document.getElementById("email").value;
            let event = document.getElementById("event").value;
            let date = document.getElementById("date").value;

            if (name == "" || phone == "" || email == "" || date == "") {
                alert("Please fill all fields");
                return;
            }

            let response = await fetch("/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    email: email,
                    event: event,
                    date: date
                })
            });

            let result = await response.json();

            if (result.message == "Registration Successful!") {

                let table = document.getElementById("userTable");

                let row = table.insertRow();

                row.insertCell(0).innerHTML = result.name;
                row.insertCell(1).innerHTML = result.phone;
                row.insertCell(2).innerHTML = result.email;
                row.insertCell(3).innerHTML = result.event;
                row.insertCell(4).innerHTML = result.date;

                alert(result.message);

                document.getElementById("name").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("email").value = "";
                document.getElementById("date").value = "";
            }
        }

    </script>

</body>

</html>
